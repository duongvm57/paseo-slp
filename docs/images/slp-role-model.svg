<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1568 976" role="img" aria-label="Paseo SLP role model — governance constellation with optional Jev routing advisory">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#101a30"/>
      <stop offset="1" stop-color="#0a0e1a"/>
    </linearGradient>
    <radialGradient id="halo" cx="0.5" cy="0.16" r="0.42">
      <stop offset="0" stop-color="#24304f" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#24304f" stop-opacity="0"/>
    </radialGradient>
    <pattern id="dots" width="26" height="26" patternUnits="userSpaceOnUse">
      <circle cx="1.2" cy="1.2" r="1.2" fill="#1c2742"/>
    </pattern>
    <marker id="ahAmber" markerWidth="10" markerHeight="10" refX="8" refY="4" orient="auto">
      <path d="M0 0l8 4-8 4z" fill="#e8b04b"/>
    </marker>
    <marker id="ahTeal" markerWidth="10" markerHeight="10" refX="8" refY="4" orient="auto">
      <path d="M0 0l8 4-8 4z" fill="#45c8ae"/>
    </marker>
    <marker id="ahViolet" markerWidth="10" markerHeight="10" refX="8" refY="4" orient="auto">
      <path d="M0 0l8 4-8 4z" fill="#9d8ceb"/>
    </marker>
    <marker id="ahSlate" markerWidth="10" markerHeight="10" refX="8" refY="4" orient="auto">
      <path d="M0 0l8 4-8 4z" fill="#8b98b8"/>
    </marker>
  </defs>

  <rect width="1568" height="976" fill="url(#bg)"/>
  <rect width="1568" height="976" fill="url(#halo)"/>
  <rect width="1568" height="976" fill="url(#dots)"/>

  <!-- header -->
  <text x="70" y="76" font-family="ui-sans-serif, system-ui, sans-serif" font-size="13" letter-spacing="4" fill="#7c8db5">PASEO SLP / ROLE MODEL</text>
  <text x="70" y="112" font-family="ui-sans-serif, system-ui, sans-serif" font-size="34" font-weight="700" fill="#eef2fb">Different kinds of judgment, one accountable flow.</text>
  <line x1="70" y1="138" x2="1498" y2="138" stroke="#1c2640" stroke-width="1"/>

  <!-- ============ HUMAN ============ -->
  <rect x="578" y="167" width="412" height="102" rx="18" fill="#1a1810" fill-opacity="0.85" stroke="#e8b04b" stroke-width="1.6"/>
  <rect x="598" y="186" width="64" height="64" rx="14" fill="#e8b04b"/>
  <circle cx="630" cy="208" r="11" fill="none" stroke="#14181f" stroke-width="3"/>
  <path d="M612 240 q18 -18 36 0" fill="none" stroke="#14181f" stroke-width="3"/>
  <text x="682" y="206" font-family="ui-sans-serif, system-ui, sans-serif" font-size="13" letter-spacing="2.5" fill="#e8b04b">OWNER AUTHORITY</text>
  <text x="682" y="234" font-family="ui-sans-serif, system-ui, sans-serif" font-size="28" font-weight="700" fill="#eef2fb">Human</text>
  <text x="682" y="258" font-family="ui-sans-serif, system-ui, sans-serif" font-size="13" fill="#9fb0d4">Intent · boundaries · final acceptance</text>

  <!-- assigns chip + fan-out -->
  <rect x="615" y="297" width="338" height="26" rx="13" fill="#141b2e" stroke="#3a3220" stroke-width="1"/>
  <text x="784" y="314" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" letter-spacing="2" fill="#e8b04b">ASSIGNS / CREATES THE SEATS</text>
  <line x1="784" y1="269" x2="784" y2="297" stroke="#e8b04b" stroke-width="1.6"/>
  <line x1="345" y1="310" x2="615" y2="310" stroke="#e8b04b" stroke-width="1.6"/>
  <line x1="953" y1="310" x2="985" y2="310" stroke="#e8b04b" stroke-width="1.6"/>
  <line x1="345" y1="310" x2="345" y2="366" stroke="#e8b04b" stroke-width="1.6" marker-end="url(#ahAmber)"/>
  <line x1="985" y1="310" x2="985" y2="366" stroke="#e8b04b" stroke-width="1.6" marker-end="url(#ahAmber)"/>

  <!-- workflow signal: Supervisor -> Human -->
  <path d="M330 366 C330 330 470 300 566 282" fill="none" stroke="#45c8ae" stroke-width="1.4" marker-end="url(#ahTeal)"/>
  <text x="308" y="326" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" fill="#45c8ae">workflow signal</text>

  <!-- project verdict: Lead -> Human -->
  <path d="M1270 366 C1270 330 1090 300 996 282" fill="none" stroke="#9d8ceb" stroke-width="1.4" marker-end="url(#ahViolet)"/>
  <text x="1150" y="326" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" fill="#9d8ceb">project verdict</text>

  <!-- ============ SUPERVISOR ============ -->
  <rect x="124" y="373" width="446" height="195" rx="18" fill="#0e1a1c" fill-opacity="0.85" stroke="#45c8ae" stroke-width="1.4"/>
  <rect x="150" y="397" width="64" height="64" rx="14" fill="#123b33" stroke="#45c8ae" stroke-width="1.2"/>
  <circle cx="182" cy="429" r="16" fill="none" stroke="#45c8ae" stroke-width="2"/>
  <circle cx="182" cy="429" r="4" fill="#45c8ae"/>
  <line x1="182" y1="405" x2="182" y2="413" stroke="#45c8ae" stroke-width="2"/>
  <line x1="182" y1="445" x2="182" y2="453" stroke="#45c8ae" stroke-width="2"/>
  <line x1="158" y1="429" x2="166" y2="429" stroke="#45c8ae" stroke-width="2"/>
  <line x1="198" y1="429" x2="206" y2="429" stroke="#45c8ae" stroke-width="2"/>
  <text x="228" y="417" font-family="ui-sans-serif, system-ui, sans-serif" font-size="13" letter-spacing="2.5" fill="#45c8ae">GOVERNANCE OBSERVER</text>
  <text x="228" y="445" font-family="ui-sans-serif, system-ui, sans-serif" font-size="28" font-weight="700" fill="#eef2fb">Supervisor</text>
  <text x="150" y="494" font-family="ui-sans-serif, system-ui, sans-serif" font-size="15" fill="#cdd8ec">Watches workflow quality and reasoning.</text>
  <text x="150" y="522" font-family="ui-sans-serif, system-ui, sans-serif" font-size="13" fill="#7c8db5">Bias · momentum · drift · weak evidence</text>
  <line x1="150" y1="538" x2="546" y2="538" stroke="#1e3a34" stroke-width="1"/>
  <text x="150" y="558" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" font-weight="600" fill="#8fd9c6">Outside execution: no implementation, architecture or acceptance.</text>

  <!-- OBSERVES LEAD -->
  <line x1="570" y1="443" x2="712" y2="443" stroke="#45c8ae" stroke-width="1.4" stroke-dasharray="7 6" marker-end="url(#ahTeal)"/>
  <rect x="588" y="417" width="140" height="24" rx="12" fill="#0e1a1c" stroke="#1e3a34" stroke-width="1"/>
  <text x="658" y="433" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11" letter-spacing="1.5" fill="#45c8ae">OBSERVES LEAD</text>

  <!-- ============ LEAD ============ -->
  <rect x="742" y="373" width="696" height="195" rx="18" fill="#141227" fill-opacity="0.85" stroke="#9d8ceb" stroke-width="1.4"/>
  <rect x="768" y="397" width="64" height="64" rx="14" fill="#221c40" stroke="#9d8ceb" stroke-width="1.2"/>
  <path d="M800 409 l14 8 v14 c0 10 -7 16 -14 20 c-7 -4 -14 -10 -14 -20 v-14 z" fill="none" stroke="#9d8ceb" stroke-width="2"/>
  <circle cx="800" cy="431" r="4" fill="#9d8ceb"/>
  <text x="846" y="417" font-family="ui-sans-serif, system-ui, sans-serif" font-size="13" letter-spacing="2.5" fill="#9d8ceb">PROJECT AUTHORITY</text>
  <text x="846" y="445" font-family="ui-sans-serif, system-ui, sans-serif" font-size="28" font-weight="700" fill="#eef2fb">Lead</text>
  <text x="768" y="494" font-family="ui-sans-serif, system-ui, sans-serif" font-size="15" fill="#cdd8ec">Frames, routes, integrates and returns the project verdict.</text>
  <g font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" fill="#c3bdf0">
    <rect x="768" y="516" width="106" height="28" rx="14" fill="#221c40"/>
    <text x="821" y="534" text-anchor="middle">one owner / scope</text>
    <rect x="884" y="516" width="86" height="28" rx="14" fill="#221c40"/>
    <text x="927" y="534" text-anchor="middle">topology</text>
    <rect x="980" y="516" width="96" height="28" rx="14" fill="#221c40"/>
    <text x="1028" y="534" text-anchor="middle">review gate</text>
    <rect x="1086" y="516" width="92" height="28" rx="14" fill="#221c40"/>
    <text x="1132" y="534" text-anchor="middle">integration</text>
    <rect x="1188" y="516" width="128" height="28" rx="14" fill="#221c40"/>
    <text x="1252" y="534" text-anchor="middle">technical verdict</text>
  </g>

  <!-- ============ DELEGATION + JEV ============ -->
  <line x1="1090" y1="568" x2="1090" y2="652" stroke="#9d8ceb" stroke-width="1.6" marker-end="url(#ahViolet)"/>
  <rect x="975" y="594" width="230" height="26" rx="13" fill="#141227" stroke="#3a3560" stroke-width="1"/>
  <text x="1090" y="611" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" letter-spacing="1.5" fill="#9d8ceb">DELEGATES BOUNDED OUTCOMES</text>

  <!-- evidence return -->
  <line x1="790" y1="668" x2="1078" y2="668" stroke="#8b98b8" stroke-width="1.4" stroke-dasharray="7 6" marker-end="url(#ahSlate)"/>
  <rect x="640" y="668" width="0" height="0" fill="none"/>
  <rect x="638" y="680" width="330" height="24" rx="12" fill="#141b2e" stroke="#26304e" stroke-width="1"/>
  <text x="803" y="696" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11" letter-spacing="1.5" fill="#8b98b8">EVIDENCE · CHALLENGE · DEPENDENCY · BLOCKED</text>

  <!-- Jev advisory instruments: separate nodes per advisory role -->
  <line x1="1090" y1="625" x2="1218" y2="625" stroke="#8b98b8" stroke-width="1.2" stroke-dasharray="4 4"/>
  <circle cx="1090" cy="625" r="3" fill="#8b98b8"/>
  <rect x="1218" y="598" width="262" height="64" rx="10" fill="#0d1322" stroke="#8b98b8" stroke-width="1.2" stroke-dasharray="5 4"/>
  <path d="M1248 622 l8 5 v10 l-8 5 -8 -5 v-10 z" fill="none" stroke="#8b98b8" stroke-width="1.5"/>
  <circle cx="1248" cy="632" r="2" fill="#8b98b8"/>
  <text x="1266" y="628" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11" font-weight="700" letter-spacing="1.5" fill="#8b98b8">JEV — ROUTING ADVISORY</text>
  <text x="1266" y="644" font-family="ui-sans-serif, system-ui, sans-serif" font-size="10" fill="#7c8db5">optional — never a team seat</text>
  <text x="1234" y="654" font-family="ui-sans-serif, system-ui, sans-serif" font-size="10" fill="#5f6f96">route-decide receipt · advises the pool option</text>

  <line x1="892" y1="632" x2="945" y2="668" stroke="#8b98b8" stroke-width="1.2" stroke-dasharray="4 4"/>
  <circle cx="945" cy="668" r="3" fill="#8b98b8"/>
  <rect x="620" y="598" width="272" height="64" rx="10" fill="#0d1322" stroke="#8b98b8" stroke-width="1.2" stroke-dasharray="5 4"/>
  <path d="M650 622 l8 5 v10 l-8 5 -8 -5 v-10 z" fill="none" stroke="#8b98b8" stroke-width="1.5"/>
  <circle cx="650" cy="632" r="2" fill="#8b98b8"/>
  <text x="668" y="628" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11" font-weight="700" letter-spacing="1.5" fill="#8b98b8">JEV — SUPERVISION ASSESSMENT</text>
  <text x="668" y="644" font-family="ui-sans-serif, system-ui, sans-serif" font-size="10" fill="#7c8db5">optional — never a team seat</text>
  <text x="636" y="654" font-family="ui-sans-serif, system-ui, sans-serif" font-size="10" fill="#5f6f96">3-question check · brief · handback · handling</text>

  <!-- ============ PEER(S) ============ -->
  <text x="70" y="640" font-family="ui-sans-serif, system-ui, sans-serif" font-size="34" font-weight="700" fill="#eef2fb">PEER(S)</text>
  <text x="240" y="634" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11" letter-spacing="1.5" fill="#5f6f96">ONE ROLE / ASSIGNMENT SETS DISPOSITION</text>
  <line x1="70" y1="655" x2="495" y2="655" stroke="#4fc3d9" stroke-width="2"/>

  <!-- Engineer -->
  <rect x="80" y="708" width="310" height="132" rx="14" fill="#0e1a24" stroke="#4fc3d9" stroke-width="1.2"/>
  <rect x="102" y="730" width="44" height="44" rx="10" fill="#10283a" stroke="#4fc3d9" stroke-width="1"/>
  <path d="M124 742 l10 22 h-5 l-2 -5 h-8 l-2 5 h-5 z M124 750 l-2.5 5 h5 z" fill="#4fc3d9"/>
  <text x="160" y="750" font-family="ui-sans-serif, system-ui, sans-serif" font-size="19" font-weight="700" fill="#eef2fb">Engineer</text>
  <text x="160" y="770" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" fill="#7c8db5">bounded implementation</text>
  <text x="102" y="818" font-family="ui-sans-serif, system-ui, sans-serif" font-size="13" fill="#9fb0d4">Owns proof of its writes.</text>

  <!-- Architect -->
  <rect x="420" y="708" width="310" height="132" rx="14" fill="#0e1a24" stroke="#4fc3d9" stroke-width="1.2"/>
  <rect x="442" y="730" width="44" height="44" rx="10" fill="#10283a" stroke="#4fc3d9" stroke-width="1"/>
  <path d="M464 738 q7 6 7 16 l-4 7 -3 -4 -3 4 -4 -7 q0 -10 7 -16 z" fill="none" stroke="#4fc3d9" stroke-width="1.8"/>
  <circle cx="464" cy="752" r="2.5" fill="#4fc3d9"/>
  <path d="M457 758 l-4 6 M471 758 l4 6" stroke="#4fc3d9" stroke-width="1.8" fill="none"/>
  <text x="500" y="750" font-family="ui-sans-serif, system-ui, sans-serif" font-size="19" font-weight="700" fill="#eef2fb">Architect</text>
  <text x="500" y="770" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" fill="#7c8db5">independent technical judgment</text>
  <text x="442" y="818" font-family="ui-sans-serif, system-ui, sans-serif" font-size="13" fill="#9fb0d4">Challenges the premise with evidence.</text>

  <!-- Reviewer -->
  <rect x="840" y="708" width="310" height="132" rx="14" fill="#0e1a24" stroke="#4fc3d9" stroke-width="1.2"/>
  <rect x="862" y="730" width="44" height="44" rx="10" fill="#10283a" stroke="#4fc3d9" stroke-width="1"/>
  <path d="M874 764 v-22 l6 12 6 -12 v22 M874 742 h12" fill="none" stroke="#4fc3d9" stroke-width="1.8"/>
  <text x="920" y="750" font-family="ui-sans-serif, system-ui, sans-serif" font-size="19" font-weight="700" fill="#eef2fb">Reviewer</text>
  <text x="920" y="770" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" fill="#7c8db5">independent candidate check</text>
  <text x="862" y="818" font-family="ui-sans-serif, system-ui, sans-serif" font-size="13" fill="#9fb0d4">Tests a stable artifact, then reports.</text>

  <!-- Scout -->
  <rect x="1180" y="708" width="310" height="132" rx="14" fill="#0e1a24" stroke="#4fc3d9" stroke-width="1.2"/>
  <rect x="1202" y="730" width="44" height="44" rx="10" fill="#10283a" stroke="#4fc3d9" stroke-width="1"/>
  <circle cx="1220" cy="748" r="9" fill="none" stroke="#4fc3d9" stroke-width="2"/>
  <line x1="1227" y1="755" x2="1234" y2="762" stroke="#4fc3d9" stroke-width="2.5"/>
  <text x="1260" y="750" font-family="ui-sans-serif, system-ui, sans-serif" font-size="19" font-weight="700" fill="#eef2fb">Scout</text>
  <text x="1260" y="770" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" fill="#7c8db5">bounded discovery</text>
  <text x="1202" y="818" font-family="ui-sans-serif, system-ui, sans-serif" font-size="13" fill="#9fb0d4">Separates facts from inference.</text>

  <!-- legend -->
  <line x1="70" y1="890" x2="1498" y2="890" stroke="#1c2640" stroke-width="1"/>
  <g font-family="ui-sans-serif, system-ui, sans-serif" font-size="13" fill="#9fb0d4">
    <circle cx="92" cy="928" r="5" fill="#e8b04b"/>
    <text x="104" y="933">authority &amp; assignment</text>
    <circle cx="300" cy="928" r="5" fill="#45c8ae"/>
    <text x="312" y="933">governance observation</text>
    <circle cx="540" cy="928" r="5" fill="#9d8ceb"/>
    <text x="552" y="933">project coordination</text>
    <circle cx="772" cy="928" r="5" fill="#4fc3d9"/>
    <text x="784" y="933">bounded independent work</text>
    <circle cx="1012" cy="928" r="5" fill="#8b98b8"/>
    <text x="1024" y="933">optional advisory</text>
  </g>
  <text x="1498" y="933" text-anchor="end" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" letter-spacing="2" fill="#5f6f96">POLICY, NOT A COMMAND HIERARCHY</text>
</svg>
